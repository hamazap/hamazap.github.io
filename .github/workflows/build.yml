name: Publish Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          A71E30: ${{ secrets.A71E30 }}
          B6577A: ${{ secrets.B6577A }}
        run: |
          python3 -c "
          import pathlib, sys, os
          env_a = os.environ.get('A71E30', '')
          env_b = os.environ.get('B6577A', '')
          doc = pathlib.Path('index.html')
          body = doc.read_text(encoding='utf-8')
          result = body
          if env_a:
              result = result.replace('<!-- 307bd63196f37ee29ccb5c54fa6be968bdf8b0285980 -->', env_a)
          if env_b:
              result = result.replace('<!-- 064ed1d3d30cbfdbb63f87ecbf16 -->', env_b)
          if result == body and (env_a or env_b):
              sys.exit(1)
          if result != body:
              doc.write_text(result, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
